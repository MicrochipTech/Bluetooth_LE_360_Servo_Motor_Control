<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Target applications for wireless continuous-rotation servo control</title>
  <desc id="desc">An MBD phone controls a wireless MCU and a continuous-rotation servo. Three potential end products are a tabletop rover drive, a rotating display, and a miniature conveyor. The slider commands speed from 0 to 100 in either separately selected direction, with START and STOP controls. These are integration ideas, not validated complete products.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b162b"/><stop offset="1" stop-color="#173553"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
  </defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/>
  <circle cx="1130" cy="50" r="180" fill="#fbbf24" opacity=".04"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="44" y="46" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="3">TARGET APPLICATIONS / CONTINUOUS ROTATION</text>
    <text x="44" y="98" fill="#f8fafc" font-size="38" font-weight="700">Bring wireless rotation to your next product.</text>
    <text x="44" y="134" fill="#cbd5e1" font-size="20">Drive a wheel. Turn a display. Move a belt. Control rotation from your phone.</text>
    <rect x="44" y="166" width="1112" height="104" rx="18" fill="#213b58"/>
    <g fill="#f8fafc" font-size="21" font-weight="600" text-anchor="middle">
      <text x="175" y="210">MBD app</text><text x="580" y="210">Wireless MCU</text><text x="1000" y="210">Continuous servo</text>
    </g>
    <g fill="#a5d9ef" font-size="15" text-anchor="middle">
      <text x="175" y="241">Speed / direction / start-stop</text><text x="580" y="241">Zephyr + BLE servo application</text><text x="1000" y="241">Rotation, not angle positioning</text>
    </g>
    <g stroke="url(#accent)" stroke-width="3" fill="none">
      <path d="M296 215H405m-9-7 9 7-9 7M758 215H864m-9-7 9 7-9 7"/>
    </g>
    <text x="350" y="198" fill="#67e8f9" font-size="13" text-anchor="middle">Bluetooth LE</text>
    <text x="812" y="198" fill="#fde68a" font-size="13" text-anchor="middle">PWM pin</text>
    <g fill="#132a43" stroke="#31516d">
      <rect x="44" y="300" width="352" height="232" rx="18"/><rect x="424" y="300" width="352" height="232" rx="18"/><rect x="804" y="300" width="352" height="232" rx="18"/>
    </g>
    <g fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M158 399V365H282V399M198 365V348H244V365"/><circle cx="177" cy="410" r="16"/><circle cx="263" cy="410" r="16"/>
      <ellipse cx="600" cy="399" rx="73" ry="17"/><path d="M527 399V414Q600 444 673 414V399M580 379V344H620V379M551 343Q600 319 649 343M641 330L650 343L636 347"/>
      <rect x="904" y="377" width="151" height="44" rx="22"/><circle cx="928" cy="399" r="11"/><circle cx="1031" cy="399" r="11"/><path d="M955 376V348H990V376M923 422V436M1036 422V436"/>
    </g>
    <g fill="#f8fafc" font-size="23" font-weight="700" text-anchor="middle">
      <text x="220" y="469">Tabletop rover drive</text><text x="600" y="469">Rotating display</text><text x="980" y="469">Miniature conveyor</text>
    </g>
    <g fill="#b9cddd" font-size="16" text-anchor="middle">
      <text x="220" y="500">Control a wheel-drive actuator</text><text x="600" y="500">Choose rotation speed and direction</text><text x="980" y="500">Run or stop a small belt drive</text>
    </g>
    <rect x="44" y="553" width="1112" height="46" rx="12" fill="#244761"/>
    <text x="600" y="583" fill="#fde68a" font-size="20" font-weight="700" text-anchor="middle">SPEED SLIDER 0-100  |  SELECT CW / CCW  |  START / STOP  |  NOT MEASURED RPM</text>
    <text x="44" y="629" fill="#a6bdce" font-size="14">Potential integrations only. Add suitable safety controls: BLE disconnect does not automatically stop this demo.</text>
  </g>
</svg>
