<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Continuous-rotation servo: speed and direction encoded as pulse width</title>
  <desc id="desc">The MBD slider controls the speed command from 0 to 100 in either selected direction, CW or CCW. Direction is selected separately. START applies the setting and STOP commands neutral. Tested hardware: Tower Pro MG996R 360-degree continuous-rotation variant, operated at 5 V. Three pulses shown on a common 20 millisecond time scale. While started, maximum CW commands 0.5 milliseconds at 2.5 percent duty, neutral commands 1.5 milliseconds at 7.5 percent, and maximum CCW commands 2.5 milliseconds at 12.5 percent. Stop or a zero speed setting commands neutral. The period remains 20 milliseconds, or 50 hertz.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101e38"/>
      <stop offset="1" stop-color="#172b4b"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="600" rx="24" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="46" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="3">BLUETOOTH LE + ZEPHYR</text>
    <text x="40" y="93" fill="#f8fafc" font-size="34" font-weight="700">360-degree servo: command the rotation</text>
    <text x="40" y="126" fill="#cbd5e1" font-size="18">MBD slider: speed 0-100 in either selected direction. START runs; STOP commands neutral.</text>
    <rect x="40" y="150" width="1020" height="48" rx="12" fill="#233b5b"/>
    <text x="61" y="180" fill="#f8fafc" font-size="17">20 ms / 50 Hz</text>
    <text x="320" y="180" fill="#f8fafc" font-size="17">Speed command 0-100</text>
    <text x="620" y="180" fill="#f8fafc" font-size="17">CW / CCW</text>
    <text x="850" y="180" fill="#86efac" font-size="17">Neutral: 1.5 ms</text>
    <g stroke="#39516d" stroke-dasharray="4 6">
      <path d="M230 225V460 M430 225V460 M630 225V460 M830 225V460 M1030 225V460"/>
    </g>
    <g font-size="13" fill="#94a3b8">
      <text x="222" y="487">0</text>
      <text x="422" y="487">5</text>
      <text x="619" y="487">10</text>
      <text x="819" y="487">15</text>
      <text x="1016" y="487">20 ms</text>
    </g>
    <g fill="#f8fafc" font-size="21" font-weight="700">
      <text x="40" y="263">CW / 100</text>
      <text x="40" y="348">STOP</text>
      <text x="40" y="433">CCW / 100</text>
    </g>
    <g fill="#cbd5e1" font-size="14">
      <text x="40" y="286">0.5 ms / 2.5%</text>
      <text x="40" y="371">1.5 ms / 7.5%</text>
      <text x="40" y="456">2.5 ms / 12.5%</text>
    </g>
    <path d="M230 285V240H250V285H1030V240" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M230 370V325H290V370H1030V325" fill="none" stroke="#4ade80" stroke-width="4" stroke-linejoin="round"/>
    <path d="M230 455V410H330V455H1030V410" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linejoin="round"/>
    <g font-size="15" font-weight="600">
      <text x="268" y="258" fill="#7dd3fc">Maximum CW command while STARTED</text>
      <text x="308" y="343" fill="#86efac">Neutral: STOP or speed = 0</text>
      <text x="348" y="428" fill="#fde68a">Maximum CCW command while STARTED</text>
    </g>
    <text x="40" y="531" fill="#cbd5e1" font-size="15">Speed is not RPM. Neutral and physical direction depend on the servo. BLE disconnect does not stop it.</text>
    <text x="40" y="575" fill="#67e8f9" font-size="17" font-weight="600">Tested servo: Tower Pro MG996R - 360-degree continuous-rotation variant - operated at 5 V</text>
  </g>
</svg>
